<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frase Trappola — Macchina Narrativa</title>

  <style>
    :root {
      --bg: #0f1115;
      --card-bg: #181b20;
      --border: #2a2e37;
      --text: #e6e8ec;
      --text-muted: #8b92a0;
      --accent: #ff4757;
      --accent-hover: #ff6b81;
      --secondary: #2f3542;
      --secondary-hover: #57606f;
      --font-mono: "SF Mono", "Fira Code", "Roboto Mono", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.5;
      padding: 24px 16px;
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 span {
      color: var(--accent);
    }

    p.subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    input[type="text"] {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 32px;
    }

    button {
      font-family: var(--font-sans);
      font-size: 0.875rem;
      font-weight: 600;
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      grid-column: span 2;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--secondary);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--secondary-hover);
    }

    .btn-glitch {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .btn-glitch:hover {
      background: rgba(255, 71, 87, 0.1);
    }

    .sequence-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .sequence-container::before {
      content: "";
      position: absolute;
      top: 20px;
      bottom: 20px;
      left: 19px;
      width: 2px;
      background: var(--border);
      z-index: 0;
    }

    .step-item {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }

    .step-number {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      min-width: 18px;
      text-align: center;
    }

    .step-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .step-input:focus {
      color: #fff;
    }

    .step-error {
      border-color: rgba(255, 71, 87, 0.5);
    }

    .step-error .step-number {
      color: var(--accent);
    }

    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .controls {
        grid-template-columns: 1fr;
      }
      .btn-primary {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1><span>///</span> Frase Trappola</h1>
    <p class="subtitle">Generatore di metamorfosi narrativa progressiva</p>
  </header>

  <main>
    <section class="input-group">
      <div class="field">
        <label for="start-phrase">Frase di Partenza</label>
        <input type="text" id="start-phrase" placeholder="Es. Ho dimenticato le chiavi sul tavolo.">
      </div>
      <div class="field">
        <label for="target-phrase">Frase di Arrivo</label>
        <input type="text" id="target-phrase" placeholder="Es. Il ministro dormiva dentro un’automobile.">
      </div>
    </section>

    <section class="controls">
      <button class="btn-primary" id="btn-build">Costruisci la Trappola</button>
      <button class="btn-secondary" id="btn-variant">Nuova Variante</button>
      <button class="btn-glitch" id="btn-glitch">Forza l'Errore ⚡</button>
    </section>

    <section>
      <label style="margin-bottom: 12px; display: block;">Sequenza Intermedia (Modificabile)</label>
      <div class="sequence-container" id="sequence-list">
        <!-- I passaggi verranno inseriti qui dinamicamente -->
      </div>
    </section>
  </main>

  <footer>
    Salvataggio automatico attivo su memoria locale.
  </footer>

  <script>
    const STORAGE_KEY = 'frase_trappola_data_v1';

    const defaultState = {
      start: "Ho dimenticato le chiavi sul tavolo.",
      target: "Il ministro dormiva dentro un’automobile.",
      chain: []
    };

    let state = loadState();

    const elStart = document.getElementById('start-phrase');
    const elTarget = document.getElementById('target-phrase');
    const elList = document.getElementById('sequence-list');
    const btnBuild = document.getElementById('btn-build');
    const btnVariant = document.getElementById('btn-variant');
    const btnGlitch = document.getElementById('btn-glitch');

    // Dizionario surreale per l'opzione "Forza l'Errore"
    const glitchNouns = ["un fantasma", "un pianoforte", "un telegramma", "l'ombra", "un anello", "il microfono", "un gatto nero"];
    const glitchVerbs = ["sussurrava", "fluttuava", "bruciava", "osservava", "nascondeva", "cancellava"];
    const glitchPlaces = ["nella nebbia", "sotto la pioggia", "nel quadro", "dietro lo specchio", "in cucina"];

    function init() {
      elStart.value = state.start || '';
      elTarget.value = state.target || '';

      elStart.addEventListener('input', () => { state.start = elStart.value; saveState(); });
      elTarget.addEventListener('input', () => { state.target = elTarget.value; saveState(); });

      btnBuild.addEventListener('click', () => buildTrap(false));
      btnVariant.addEventListener('click', () => buildTrap(false));
      btnGlitch.addEventListener('click', () => buildTrap(true));

      if (state.chain && state.chain.length > 0) {
        renderChain();
      } else if (state.start && state.target) {
        buildTrap(false);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : { ...defaultState };
      } catch (e) {
        return { ...defaultState };
      }
    }

    function buildTrap(forceError = false) {
      const start = elStart.value.trim();
      const target = elTarget.value.trim();

      if (!start || !target) return;

      const steps = [];
      steps.push({ text: start, error: false });

      // Estrazione euristica delle componenti
      const startWords = start.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").split(/\s+/);
      const targetWords = target.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").split(/\s+/);

      const subjectT = targetWords[0] || "Qualcuno";
      const verbT = targetWords[1] || "stava";
      const objectT = targetWords.slice(2, -2).join(" ") || "qualcosa";
      const placeT = targetWords.slice(-2).join(" ") || "altrove";

      // Passaggio 1: Sostituzione Oggetto/Complemento
      let step1 = start.replace(/(le chiavi|il telefono|il documento|il libro|[a-zàèéìòù]+)$/i, objectT);
      if (step1 === start) step1 = `${startWords.slice(0, -2).join(" ")} ${objectT}.`;
      steps.push({ text: step1, error: false });

      // Eventuale Iniezione Errore / Glitch
      if (forceError) {
        const rndNoun = glitchNouns[Math.floor(Math.random() * glitchNouns.length)];
        const rndPlace = glitchPlaces[Math.floor(Math.random() * glitchPlaces.length)];
        const errStep = `Ho trovato ${rndNoun} ${rndPlace}.`;
        steps.push({ text: errStep, error: true });
      }

      // Passaggio 2: Sostituzione Luogo/Contesto
      let step2 = `Ho trovato ${objectT} ${placeT}.`;
      steps.push({ text: step2, error: false });

      // Passaggio 3: Introdurre il terzo soggetto/ruolo
      let step3 = `Un uomo lavorava con ${objectT} ${placeT}.`;
      steps.push({ text: step3, error: false });

      // Passaggio 4: Convergenza verso il Soggetto Finale
      let step4 = `${subjectT} lavorava ${placeT}.`;
      steps.push({ text: step4, error: false });

      // Passaggio Finale
      steps.push({ text: target, error: false });

      state.chain = steps;
      saveState();
      renderChain();
    }

    function renderChain() {
      elList.innerHTML = '';

      state.chain.forEach((step, index) => {
        const item = document.createElement('div');
        item.className = `step-item ${step.error ? 'step-error' : ''}`;

        const num = document.createElement('span');
        num.className = 'step-number';
        num.textContent = String(index + 1).padStart(2, '0');

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'step-input';
        input.value = step.text;

        input.addEventListener('input', (e) => {
          state.chain[index].text = e.target.value;
          saveState();
        });

        item.appendChild(num);
        item.appendChild(input);
        elList.appendChild(item);
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
